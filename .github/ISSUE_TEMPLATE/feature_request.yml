name: Feature request
description: Suggest a portable collector, inference integration, benchmark, or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or limitation, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Environment and portability impact
      description: Note whether this is specific to NVIDIA, vLLM, DGX Spark, macOS, Linux, or a general OpenAI-compatible endpoint.
